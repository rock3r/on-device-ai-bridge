<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chip body -->
  <rect x="28" y="28" width="72" height="72" rx="14" fill="#2D2D2D"/>
  <!-- Chip pins - top -->
  <rect x="44" y="18" width="6" height="14" rx="2" fill="#2D2D2D"/>
  <rect x="61" y="18" width="6" height="14" rx="2" fill="#2D2D2D"/>
  <rect x="78" y="18" width="6" height="14" rx="2" fill="#2D2D2D"/>
  <!-- Chip pins - bottom -->
  <rect x="44" y="96" width="6" height="14" rx="2" fill="#2D2D2D"/>
  <rect x="61" y="96" width="6" height="14" rx="2" fill="#2D2D2D"/>
  <rect x="78" y="96" width="6" height="14" rx="2" fill="#2D2D2D"/>
  <!-- Chip pins - left -->
  <rect x="18" y="44" width="14" height="6" rx="2" fill="#2D2D2D"/>
  <rect x="18" y="61" width="14" height="6" rx="2" fill="#2D2D2D"/>
  <rect x="18" y="78" width="14" height="6" rx="2" fill="#2D2D2D"/>
  <!-- Chip pins - right -->
  <rect x="96" y="44" width="14" height="6" rx="2" fill="#2D2D2D"/>
  <rect x="96" y="61" width="14" height="6" rx="2" fill="#2D2D2D"/>
  <rect x="96" y="78" width="14" height="6" rx="2" fill="#2D2D2D"/>
  <!-- Neural connections -->
  <line x1="50" y1="52" x2="64" y2="44" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="44" x2="78" y2="52" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="50" y2="76" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="52" x2="78" y2="76" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="64" y2="84" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="76" x2="64" y2="84" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="78" y2="76" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="78" y1="52" x2="50" y2="76" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="64" y1="44" x2="64" y2="84" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Neural nodes -->
  <circle cx="64" cy="44" r="4" fill="#007AFF"/>
  <circle cx="50" cy="52" r="4" fill="#007AFF"/>
  <circle cx="78" cy="52" r="4" fill="#007AFF"/>
  <circle cx="64" cy="64" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="50" cy="76" r="4" fill="#007AFF"/>
  <circle cx="78" cy="76" r="4" fill="#007AFF"/>
  <circle cx="64" cy="84" r="4" fill="#007AFF"/>
</svg>